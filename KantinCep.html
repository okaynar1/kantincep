<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>KantinCep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fbf6ea;--card:#fff;--tx:#1b2e22;--mu:#5d6b61;--g:#1f5c3a;--g2:#dff0e4;--bd:#e4dcc6;--y:#b7791f;--r:#b42318;--b:#1d5fa8;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a14;--card:#192820;--tx:#eaf3ec;--mu:#9bb0a1;--g:#6fcf97;--g2:#23382b;--bd:#2c4234;--y:#f0b44c;--r:#ff8f85;--b:#7db7f2;--on:#0b1a11}}
:root[data-theme=dark]{--bg:#101a14;--card:#192820;--tx:#eaf3ec;--mu:#9bb0a1;--g:#6fcf97;--g2:#23382b;--bd:#2c4234;--y:#f0b44c;--r:#ff8f85;--b:#7db7f2;--on:#0b1a11}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:.2em 0}h2{font-size:1.3rem}h3{font-size:1.05rem}
.demo{background:var(--y);color:#000;font-size:.8rem;padding:6px 12px;text-align:center}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:28px 8px}.hero h1{font-size:2.4rem;color:var(--g)}.hero p{color:var(--mu)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--g);color:var(--on);cursor:pointer;min-height:44px}
button.sec{background:var(--g2);color:var(--g)}button.dng{background:var(--r);color:var(--on)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-height:44px}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 3px}
.layout{display:flex;min-height:100vh}
nav{width:220px;background:var(--card);border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav button{text-align:left;background:transparent;color:var(--tx)}nav button.on{background:var(--g2);color:var(--g);font-weight:600}
main{flex:1;padding:16px;min-width:0;padding-bottom:90px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;background:var(--g2);color:var(--g)}
.badge.w{background:#fff3d6;color:#8a5a00}.badge.x{background:#fde4e1;color:var(--r)}.badge.i{background:#dcebfb;color:var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:.9rem;vertical-align:top}
.kpi{font-size:1.7rem;font-weight:700;color:var(--g)}.mu{color:var(--mu);font-size:.85rem}
.emo{font-size:2.2rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;display:none;max-width:90vw}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}.modal .card{max-width:420px;width:100%}
@media(max-width:800px){.layout{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;border-top:1px solid var(--bd);border-right:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}nav button{white-space:nowrap;font-size:.8rem;padding:8px 10px}nav .brand{display:none}}
</style></head><body>
<div class="demo">TANITIM SÜRÜMÜ — Veriler yalnızca bu tarayıcıda tutulur; sunucu, gerçek kimlik doğrulama ve gerçek ödeme yoktur.</div>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div><div id="mod"></div>
<script>
const $=s=>document.querySelector(s),TL=k=>(k/100).toLocaleString('tr-TR',{style:'currency',currency:'TRY'}),
fd=d=>d.split('-').reverse().join('.'),today=()=>{const x=new Date();return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
uid=p=>p+Math.random().toString(36).slice(2,8).toUpperCase();
const ST=['Ödeme bekleniyor','Ödendi / Beklemede','Hazırlanıyor','Hazırlandı','Teslim edildi','İptal edildi','Ödeme başarısız'];
const NEXT={'Ödendi / Beklemede':'Hazırlanıyor','Hazırlanıyor':'Hazırlandı','Hazırlandı':'Teslim edildi'};
function seed(){const P=(id,n,d,pr,st,t,al)=>({id,name:n,desc:d,price:pr,stock:st,type:t,al,active:true});
return{products:[P('p1','Peynirli Tost','Kaşarlı, taze ekmek',4500,30,'food','Gluten, süt'),P('p2','Simit','Taze fırın',1500,50,'food','Gluten, susam'),P('p3','Meyve Suyu','200 ml',1800,40,'food',''),P('p4','Ayran','200 ml',1200,40,'food','Süt'),P('p5','Kek','Sade',2000,25,'food','Gluten, yumurta'),P('s1','Defter','40 yaprak çizgili',3000,0,'stat',''),P('s2','Kalem Seti','3 adet kurşun kalem',2500,0,'stat',''),P('s3','Boya Kalemi','12 renk',5500,0,'stat',''),P('s4','Silgi','Beyaz silgi',700,0,'stat','')],
breaks:[{id:'b1',name:'1. Teneffüs',start:'09:40',end:'09:50'},{id:'b2',name:'2. Teneffüs',start:'10:30',end:'10:50'},{id:'b3',name:'Öğle Arası',start:'12:10',end:'12:50'}],
students:[{id:'st1',name:'Deneme Öğrenci',grade:'5-A'}],orders:[],dons:[],pool:{},needs:[],codes:[],allocs:[],notifs:[],audit:[],
accts:[{id:'u1',name:'Ayşe Öğretmen',email:'ayse@ornek.test',role:'Öğretmen',active:true},{id:'u2',name:'Okul Kantini',email:'kantin@ornek.test',role:'Kantinci',active:true}],
schools:[{id:'o1',name:'Örnek İlkokulu',active:true}],acceptUntil:'09:00',partial:true}}
let S;try{S=JSON.parse(localStorage.getItem('kc2'))}catch(e){}const okS=s=>s&&typeof s=='object'&&['products','breaks','students','orders','dons','needs','codes','allocs','notifs','audit','accts','schools'].every(k=>Array.isArray(s[k]))&&s.pool&&typeof s.pool=='object';if(!okS(S))S=seed();
const save=()=>{try{localStorage.setItem('kc2',JSON.stringify(S))}catch(e){}};
const log=(a,e)=>{S.audit.unshift({t:new Date().toLocaleString('tr-TR'),role,a,e});S.audit=S.audit.slice(0,200)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
let role=null,tab='',cart=[],fails=0,lockUntil=0,busy=false;
const ROLES={Veli:['👪','Ürünler','Sepetim','Siparişlerim','Dayanışma Havuzu','Eğitim Desteği','Öğrencilerim','Bağış Geçmişim','Bildirimler'],
Kantinci:['🧑‍🍳','Özet','Siparişler','Ürünler ve Stok','Bağış Stoğu','Öğrenci Destek Tahsisleri'],
Öğretmen:['🍎','İhtiyaç Kayıtları','Ürün Tahsisi','Tahsis Takibi','Kaynak Durumu'],
'Kurum Müdürü':['🏫','Genel Bakış','Hesaplar','Teneffüsler','Raporlar','İşlem Kayıtları'],
'Sistem Yöneticisi':['⚙️','Okullar','Denetim Kayıtları']};
function login(r){role=r;tab=ROLES[r][1];cart=[];render()}
function logout(){role=null;render()}
function render(){const A=$('#app');
if(!role){A.innerHTML=`<div class="wrap"><div class="hero"><div class="emo">🥪💚</div><h1>KantinCep</h1><h3>Sıranı bekleme, iyiliği paylaş!</h3><p>Okul kantini ön siparişi, Dayanışma Havuzu ve Eğitim Desteği tek platformda.</p></div>
<div class="grid">${Object.keys(ROLES).map(r=>`<div class="card"><div class="emo">${ROLES[r][0]}</div><h3>${r} Girişi</h3><p class="mu">${r=='Veli'?'Sipariş ver, destek ol.':'Demo girişi (gerçek sürümde yalnızca yetkili hesap).'}</p><button onclick="login('${r}')">${r} olarak devam et</button></div>`).join('')}</div><p style="text-align:center"><button class="sec" onclick="theme()">Açık/Koyu tema</button> <button class="sec" onclick="resetDemo()">Demo verilerini sıfırla</button></p></div>`;return}
const tabs=ROLES[role].slice(1),un=S.notifs.filter(n=>n.to==role&&!n.read).length;
A.innerHTML=`<div class="layout"><nav aria-label="Menü"><div class="brand"><b style="color:var(--g);font-size:1.2rem">KantinCep</b><div class="mu">${role}</div></div>
${tabs.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';render()">${t}${t=='Bildirimler'&&un?' ('+un+')':''}</button>`).join('')}<button class="sec" onclick="theme()">Açık/Koyu tema</button><button class="sec" onclick="logout()">Çıkış Yap</button></nav><main>${view()}</main></div>`}
function pill(s){const c={'Teslim edildi':'','Hazırlandı':'i','Hazırlanıyor':'i','İptal edildi':'x','Ödeme başarısız':'x','Ödeme bekleniyor':'w','Ödendi / Beklemede':'w'}[s]??'';return`<span class="badge ${c}">${esc(s)}</span>`}
const empty=m=>`<div class="card mu">${m}</div>`;
function notify(to,m){S.notifs.unshift({to,m,t:new Date().toLocaleString('tr-TR'),read:false})}
function view(){const f=V[role]?.[tab];return f?f():''}
const avail=(t,pid)=>{const p=S.pool[pid];return p?p.qty-p.alloc-p.deliv:0};
const pname=id=>S.products.find(p=>p.id==id)?.name||'?';
const V={
Veli:{
'Ürünler':()=>`<h2>Ürün Kataloğu</h2><div class="grid">${S.products.filter(p=>p.type=='food'&&p.active).map(p=>`<div class="card"><div class="emo">🍽️</div><h3>${esc(p.name)}</h3><div class="mu">${esc(p.desc)}</div><div class="mu">Alerjen: ${esc(p.al||'Yok')}</div><div class="row sp"><b>${TL(p.price)}</b>${p.stock>0?`<span class="badge">Stokta: ${p.stock}</span>`:'<span class="badge x">Tükendi</span>'}</div><div class="row" style="margin-top:8px"><input type="number" min="1" max="${p.stock}" value="1" id="q${p.id}" aria-label="Adet" style="width:80px"><button ${p.stock<1?'disabled':''} onclick="addCart('${p.id}')">Sepete ekle</button></div></div>`).join('')}</div>`,
'Sepetim':()=>{const items=cart.map(c=>({...c,p:S.products.find(p=>p.id==c.id)})),tot=items.reduce((a,c)=>a+c.p.price*c.q,0);
return`<h2>Sepetim</h2>${!items.length?empty('Sepetiniz boş. Ürünler sekmesinden ekleyin.'):`<div class="card"><table><tr><th>Ürün</th><th>Adet</th><th>Tutar</th><th></th></tr>${items.map((c,i)=>`<tr><td>${esc(c.p.name)}<div class="mu">${TL(c.p.price)}</div></td><td><button class="sec" aria-label="Azalt" onclick="qty(${i},-1)">−</button> ${c.q} <button class="sec" aria-label="Artır" onclick="qty(${i},1)">+</button></td><td>${TL(c.p.price*c.q)}</td><td><button class="sec" onclick="cart.splice(${i},1);render()">Kaldır</button></td></tr>`).join('')}</table><h3>Toplam: ${TL(tot)}</h3>
<label for="os">Öğrenci</label><select id="os">${S.students.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.grade)})</option>`).join('')}</select>
<label for="od">Sipariş tarihi</label><input type="date" id="od" min="${today()}" value="${today()}">
<label for="ob">Teneffüs</label><select id="ob">${S.breaks.map(b=>`<option value="${b.id}">${esc(b.name)} (${b.start}-${b.end})</option>`).join('')}</select>
<label for="on">Not (isteğe bağlı)</label><input id="on" maxlength="120"><p></p><button onclick="checkout()">Ödemeye geç</button></div>`}`},
'Siparişlerim':()=>`<h2>Siparişlerim</h2>${!S.orders.length?empty('Henüz siparişiniz yok.'):S.orders.map(o=>`<div class="card" style="margin-bottom:10px"><div class="row sp"><b>${o.no}</b>${pill(o.status)}</div><div class="mu">${esc(o.student)} • ${fd(o.date)} • ${esc(o.brk)}</div><div>${o.items.map(i=>`${i.q}× ${esc(i.name)}`).join(', ')}</div><b>${TL(o.total)}</b> ${o.sim?'<span class="badge w">TEST ödemesi</span>':''}${['Ödeme bekleniyor','Ödendi / Beklemede'].includes(o.status)?` <button class="dng" onclick="cancelOrder('${o.id}')">İptal et</button>`:''}</div>`).join('')}`,
'Dayanışma Havuzu':()=>donView('food','Dayanışma Havuzu','Bir öğrencinin yemeği sizden olsun.'),
'Eğitim Desteği':()=>donView('stat','Eğitim Desteği','Kırtasiye desteğiyle bir öğrencinin yüzünü güldürün.'),
'Öğrencilerim':()=>`<h2>Öğrencilerim</h2><div class="grid">${S.students.map(s=>`<div class="card"><b>${esc(s.name)}</b><div class="mu">Sınıf: ${esc(s.grade)}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Öğrenci ekle</h3><label for="sn">Ad soyad</label><input id="sn"><label for="sg">Sınıf / şube (örn. 5-A)</label><input id="sg"><p></p><button onclick="addStudent()">Ekle</button></div>`,
'Bağış Geçmişim':()=>`<h2>Bağış Geçmişim</h2>${!S.dons.length?empty('Henüz bağışınız yok.'):`<div class="tbl card"><table><tr><th>Tür</th><th>Ürün</th><th>Tutar</th><th>Durum</th></tr>${S.dons.map(d=>`<tr><td>${d.type=='food'?'Dayanışma':'Eğitim'}</td><td>${d.q}× ${esc(d.name)}</td><td>${TL(d.total)}</td><td>${pill(d.status=='Ödendi'?'Teslim edildi':'Ödeme başarısız')} ${d.sim?'<span class="badge w">TEST</span>':''}</td></tr>`).join('')}</table></div>`}`,
'Bildirimler':()=>{S.notifs.forEach(n=>{if(n.to=='Veli')n.read=true});save();return`<h2>Bildirimler</h2>${S.notifs.filter(n=>n.to=='Veli').map(n=>`<div class="card" style="margin-bottom:8px">${esc(n.m)}<div class="mu">${n.t}</div></div>`).join('')||empty('Bildirim yok.')}`}},
Kantinci:{
'Özet':()=>{const t=S.orders.filter(o=>o.date==today()),paid=t.filter(o=>!['Ödeme bekleniyor','Ödeme başarısız','İptal edildi'].includes(o.status));
return`<h2>Bugünün Özeti</h2><div class="grid">${[['Bugünkü sipariş',t.length],['Bekleyen',t.filter(o=>o.status=='Ödendi / Beklemede').length],['Hazırlanan',t.filter(o=>o.status=='Hazırlanıyor').length],['Teslim edilen',t.filter(o=>o.status=='Teslim edildi').length],['Günlük satış (bağışsız)',TL(paid.reduce((a,o)=>a+o.total,0))],['Düşük stok (≤5)',S.products.filter(p=>p.type=='food'&&p.active&&p.stock<=5).length]].map(k=>`<div class="card"><div class="mu">${k[0]}</div><div class="kpi">${k[1]}</div></div>`).join('')}</div>`},
'Siparişler':()=>{const f=window.fil||'Tümü';return`<h2>Sipariş Yönetimi</h2><div class="row">${['Tümü',...ST.slice(1,6)].map(s=>`<button class="${f==s?'':'sec'}" onclick="fil='${s}';render()">${s}</button>`).join('')}</div><p></p>${S.orders.filter(o=>f=='Tümü'?o.status!='Ödeme bekleniyor':o.status==f).map(o=>`<div class="card" style="margin-bottom:10px"><div class="row sp"><b>${o.no}</b>${pill(o.status)}</div><div>${esc(o.student)} (${esc(o.grade)}) • ${fd(o.date)} • ${esc(o.brk)}</div><div>${o.items.map(i=>`${i.q}× ${esc(i.name)}`).join(', ')}</div><div class="mu">${o.note?'Not: '+esc(o.note):''}</div><b>${TL(o.total)}</b> ${NEXT[o.status]?`<button onclick="advance('${o.id}')">→ ${NEXT[o.status]}</button>`:''}</div>`).join('')||empty('Bu filtrede sipariş yok.')}`},
'Ürünler ve Stok':()=>`<h2>Ürün ve Stok Yönetimi</h2><div class="tbl card"><table><tr><th>Ürün</th><th>Fiyat (₺)</th><th>Stok</th><th>Durum</th><th></th></tr>${S.products.filter(p=>p.type=='food').map(p=>`<tr><td>${esc(p.name)}</td><td><input type="number" step="0.5" min="0" id="pp${p.id}" value="${p.price/100}"></td><td><input type="number" min="0" id="ps${p.id}" value="${p.stock}"></td><td>${p.active?'<span class="badge">Satışta</span>':'<span class="badge x">Kapalı</span>'}</td><td class="row"><button onclick="saveProd('${p.id}')">Kaydet</button><button class="sec" onclick="togProd('${p.id}')">${p.active?'Kapat':'Aç'}</button></td></tr>`).join('')}</table></div>
<div class="card" style="margin-top:12px"><h3>Yeni ürün</h3><div class="row"><input id="np" placeholder="Ürün adı"><input id="npp" type="number" step="0.5" placeholder="Fiyat ₺"><input id="nps" type="number" placeholder="Stok"></div><p></p><button onclick="newProd()">Ürün ekle</button></div>`,
'Bağış Stoğu':()=>`<h2>Bağış Stoğu (normal satıştan ayrı)</h2>${['food','stat'].map(t=>`<h3>${t=='food'?'Dayanışma Havuzu':'Eğitim Desteği'}</h3><div class="tbl card"><table><tr><th>Ürün</th><th>Bağış</th><th>Tahsis</th><th>Teslim</th><th>Kalan</th></tr>${Object.entries(S.pool).filter(([id])=>S.products.find(p=>p.id==id)?.type==t).map(([id,p])=>`<tr><td>${esc(pname(id))}</td><td>${p.qty}</td><td>${p.alloc}</td><td>${p.deliv}</td><td><b>${p.qty-p.alloc-p.deliv}</b></td></tr>`).join('')||'<tr><td colspan=5 class="mu">Ödenmiş bağış yok.</td></tr>'}</table></div>`).join('')}<p class="mu">Bağışçı kimlikleri kantinciye gösterilmez.</p>`,
'Öğrenci Destek Tahsisleri':()=>`<h2>Öğrenci Destek Tahsisleri</h2><div class="card"><h3>İhtiyaç kodu ile teslimat</h3><label for="dc">İhtiyaç kodu</label><input id="dc" autocomplete="off" style="text-transform:uppercase"><p></p><button onclick="verify()">Doğrula</button><div id="dres"></div></div><h3>Tüm tahsisler</h3>${S.allocs.map(a=>{const nd=S.needs.find(n=>n.id==a.needId);return`<div class="card" style="margin-bottom:8px"><div class="row sp"><b>${a.no}</b>${pill(a.status)}</div><div>${esc(nd.name)} (${esc(nd.grade)}) • ${a.type=='food'?'Dayanışma':'Eğitim'}</div><div>${a.items.map(i=>`${i.q}× ${esc(pname(i.pid))} (teslim: ${i.d})`).join(', ')}</div></div>`}).join('')||empty('Tahsis yok.')}<p class="mu">İhtiyaç açıklamaları kantinciye gösterilmez.</p>`},
Öğretmen:{
'İhtiyaç Kayıtları':()=>`<h2>Öğrenci İhtiyaç Kayıtları</h2><div class="card"><label for="nn">Öğrenci ad soyad</label><input id="nn"><label for="ng">Sınıf / şube</label><input id="ng" placeholder="5-A"><label for="nt">İhtiyaç türü</label><select id="nt"><option value="food">Yiyecek desteği</option><option value="stat">Kırtasiye desteği</option></select><label for="nd">Kısa açıklama (yalnızca öğretmen ve müdür görür)</label><input id="nd" maxlength="140"><p></p><button onclick="addNeed()">Kaydı oluştur</button></div><p></p>${S.needs.map(n=>{const c=S.codes.find(c=>c.nid==n.id&&c.st=='Aktif');return`<div class="card" style="margin-bottom:8px"><div class="row sp"><b>${esc(n.name)} (${esc(n.grade)})</b><span class="badge i">${n.type=='food'?'Yiyecek':'Kırtasiye'}</span></div><div class="mu">${esc(n.desc)}</div><div class="row">${c?`<span class="badge">Kod aktif</span><button class="sec" onclick="genCode('${n.id}')">Kodu yenile</button><button class="dng" onclick="revoke('${n.id}')">İptal</button>`:`<button onclick="genCode('${n.id}')">İhtiyaç kodu üret</button>`}</div></div>`}).join('')||empty('Kayıt yok.')}`,
'Ürün Tahsisi':()=>{const av=Object.keys(S.pool).filter(id=>avail(0,id)>0);return`<h2>Ürün Tahsisi</h2>${!S.needs.length?empty('Önce bir ihtiyaç kaydı oluşturun.'):!av.length?empty('Tahsis edilebilir bağış kaynağı yok. Veli bağışları ödendikçe burada görünür.'):`<div class="card"><label for="an">Öğrenci ihtiyacı</label><select id="an">${S.needs.map(n=>`<option value="${n.id}">${esc(n.name)} (${esc(n.grade)})</option>`).join('')}</select><label for="ap">Kaynak ürün</label><select id="ap">${av.map(id=>`<option value="${id}">${esc(pname(id))} — kalan ${avail(0,id)} (${S.products.find(p=>p.id==id).type=='food'?'Dayanışma':'Eğitim'})</option>`).join('')}</select><label for="aq">Miktar</label><input id="aq" type="number" min="1" value="1"><p></p><button onclick="allocate()">Tahsis et</button></div>`}`},
'Tahsis Takibi':()=>`<h2>Tahsis Takibi</h2>${S.allocs.map(a=>{const nd=S.needs.find(n=>n.id==a.needId);return`<div class="card" style="margin-bottom:8px"><div class="row sp"><b>${a.no}</b>${pill(a.status)}</div><div>${esc(nd.name)} • ${a.items.map(i=>`${i.q}× ${esc(pname(i.pid))} (teslim ${i.d})`).join(', ')}</div>${a.status=='Tahsis edildi'?`<button class="dng" onclick="cancelAlloc('${a.id}')">Tahsisi iptal et</button>`:''}${a.status=='Teslim edildi'?'<div class="mu">Teslim edilmiş kayıt silinemez.</div>':''}</div>`}).join('')||empty('Tahsis yok.')}`,
'Kaynak Durumu':()=>V.Kantinci['Bağış Stoğu']()},
'Kurum Müdürü':{
'Genel Bakış':()=>`<h2>Genel Bakış</h2><div class="grid">${[['Hesap',S.accts.length],['Sipariş',S.orders.length],['İhtiyaç kaydı',S.needs.length],['Tahsis',S.allocs.length]].map(k=>`<div class="card"><div class="mu">${k[0]}</div><div class="kpi">${k[1]}</div></div>`).join('')}</div>`,
'Hesaplar':()=>`<h2>Öğretmen ve Kantinci Hesapları</h2><div class="card"><div class="row"><input id="an1" placeholder="Ad soyad"><input id="ae" type="email" placeholder="E-posta"><select id="ar"><option>Öğretmen</option><option>Kantinci</option></select></div><p></p><button onclick="addAcct()">Davet oluştur</button><p class="mu">Gerçek sürümde süreli davet bağlantısı e-postayla gönderilir ve ilk girişte parola belirlenir. Şifreler görüntülenmez.</p></div><p></p>${S.accts.map(a=>`<div class="card row sp" style="margin-bottom:8px"><div><b>${esc(a.name)}</b><div class="mu">${esc(a.email)} • ${a.role}</div></div><div>${a.active?'<span class="badge">Aktif</span>':'<span class="badge x">Devre dışı</span>'} <button class="sec" onclick="togAcct('${a.id}')">${a.active?'Devre dışı bırak':'Etkinleştir'}</button></div></div>`).join('')}`,
'Teneffüsler':()=>`<h2>Teneffüs ve Sipariş Ayarları</h2>${S.breaks.map(b=>`<div class="card row" style="margin-bottom:8px"><b style="min-width:110px">${esc(b.name)}</b><input type="time" id="bs${b.id}" value="${b.start}" style="width:130px"><input type="time" id="be${b.id}" value="${b.end}" style="width:130px"><button onclick="saveBreak('${b.id}')">Kaydet</button></div>`).join('')}<div class="card row"><input id="nbn" placeholder="Yeni teneffüs adı"><button onclick="addBreak()">Ekle</button></div>`,
'Raporlar':()=>{const paid=S.orders.filter(o=>['Ödendi / Beklemede','Hazırlanıyor','Hazırlandı','Teslim edildi'].includes(o.status)),by={};paid.forEach(o=>by[o.brk]=(by[o.brk]||0)+1);const top={};paid.forEach(o=>o.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.q));
const tot=t=>Object.entries(S.pool).filter(([id])=>S.products.find(p=>p.id==id)?.type==t).reduce((a,[,p])=>[a[0]+p.qty,a[1]+p.alloc,a[2]+p.deliv],[0,0,0]);
return`<h2>Raporlar</h2><div class="grid"><div class="card"><div class="mu">Satış geliri (bağış hariç)</div><div class="kpi">${TL(paid.reduce((a,o)=>a+o.total,0))}</div></div><div class="card"><div class="mu">Bağış tutarı (ayrı)</div><div class="kpi">${TL(S.dons.filter(d=>d.status=='Ödendi').reduce((a,d)=>a+d.total,0))}</div></div><div class="card"><div class="mu">Dayanışma (bağış / tahsis / teslim)</div><b>${tot('food').join(' / ')}</b></div><div class="card"><div class="mu">Eğitim Desteği (bağış / tahsis / teslim)</div><b>${tot('stat').join(' / ')}</b></div></div>
<div class="card" style="margin-top:12px"><h3>Teneffüse göre yoğunluk</h3>${Object.entries(by).map(([k,v])=>`${esc(k)}: ${v}`).join('<br>')||'<span class="mu">Veri yok</span>'}<h3>En çok sipariş edilenler</h3>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`${esc(k)}: ${v}`).join('<br>')||'<span class="mu">Veri yok</span>'}</div><p></p><button onclick="csv()">CSV dışa aktar (kişisel veri içermez)</button>`},
'İşlem Kayıtları':()=>logView()},
'Sistem Yöneticisi':{
'Okullar':()=>`<h2>Okullar</h2>${S.schools.map(s=>`<div class="card row sp" style="margin-bottom:8px"><b>${esc(s.name)}</b><span class="badge">${s.active?'Aktif':'Pasif'}</span></div>`).join('')}<div class="card row"><input id="sch" placeholder="Okul adı"><button onclick="S.schools.push({id:uid('o'),name:$('#sch').value.trim()||'Yeni Okul',active:true});log('Okul eklendi','okul');save();render()">Okul ekle</button></div>`,
'Denetim Kayıtları':()=>logView()}};
function logView(){return`<h2>İşlem Kayıtları</h2><div class="tbl card"><table><tr><th>Zaman</th><th>Rol</th><th>İşlem</th></tr>${S.audit.map(a=>`<tr><td>${a.t}</td><td>${esc(a.role)}</td><td>${esc(a.a)}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">Kayıt yok.</td></tr>'}</table></div>`}
function donView(t,title,sub){const ps=S.products.filter(p=>p.type==t&&p.active);return`<h2>${title}</h2><p class="mu">${sub}</p><div class="grid">${ps.map(p=>`<div class="card"><div class="emo">${t=='food'?'🥪':'✏️'}</div><h3>${esc(p.name)}</h3><div class="mu">${esc(p.desc)}</div><b>${TL(p.price)}</b><div class="row" style="margin-top:8px"><input type="number" min="1" value="1" id="dq${p.id}" aria-label="Adet" style="width:80px"><button onclick="donate('${p.id}','${t}')">Bağışla</button></div></div>`).join('')}</div>`}
/* actions */
function addCart(id){const p=S.products.find(x=>x.id==id),q=Math.floor(+$('#q'+id).value),c=cart.find(x=>x.id==id);if(!(q>0)||(c?c.q:0)+q>p.stock)return toast('Geçersiz adet veya sepetteki toplam stoğu aşıyor.');c?c.q+=q:cart.push({id,q});toast(p.name+' sepete eklendi');}
function qty(i,dl){const c=cart[i],p=S.products.find(x=>x.id==c.id),n=c.q+dl;if(n<1)cart.splice(i,1);else if(n>p.stock)return toast('Stok yetersiz.');else c.q=n;render()}
function theme(){const r=document.documentElement,c=r.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',c=='dark'?'light':'dark')}
function resetDemo(){if(!confirm('Tüm demo verileri silinip başlangıç verileri yüklenecek. Devam edilsin mi?'))return;S=seed();cart=[];save();render();toast('Demo verileri sıfırlandı.')}
function addStudent(){const n=$('#sn').value.trim(),g=$('#sg').value.trim();if(n.length<3||!g)return toast('Ad soyad ve sınıf gerekli.');S.students.push({id:uid('st'),name:n,grade:g});save();render()}
function modal(h){$('#mod').innerHTML=h?`<div class="modal"><div class="card" role="dialog" aria-modal="true">${h}</div></div>`:''}
let pend=null;
function payModal(txt,total){modal(`<h3>Ödeme — TEST MODU</h3><p><span class="badge w">SİMÜLASYON</span> Gerçek para tahsil edilmez, kart bilgisi alınmaz.</p><p>${txt}<br><b>${TL(total)}</b></p><div class="row"><button onclick="payRes('ok')">Başarılı ödeme simüle et</button><button class="dng" onclick="payRes('fail')">Başarısız ödeme</button><button class="sec" onclick="payRes('cancel')">Vazgeç</button></div>`)}
function checkout(){const d=$('#od').value,b=S.breaks.find(x=>x.id==$('#ob').value),st=S.students.find(x=>x.id==$('#os').value);
if(!st)return toast('Önce öğrenci ekleyin.');if(!d||d<today())return toast('Geçmiş tarih seçilemez.');const dow=new Date(d+'T12:00').getDay();if(dow==0||dow==6)return toast('Hafta sonu sipariş alınmaz.');
if(d==today()&&new Date().toTimeString().slice(0,5)>=S.acceptUntil)return toast('Bugün için sipariş kabul süresi doldu ('+S.acceptUntil+').');
const items=[];for(const c of cart){const p=S.products.find(x=>x.id==c.id);if(!p.active||p.stock<c.q)return toast(p.name+' için yeterli stok yok.');items.push({pid:p.id,name:p.name,price:p.price,q:c.q})}
const total=items.reduce((a,i)=>a+i.price*i.q,0);pend={k:'order',o:{id:uid('o'),no:'KC-'+Date.now().toString(36).toUpperCase(),student:st.name,grade:st.grade,date:d,brk:b.name,items,total,note:$('#on').value.trim(),status:'Ödeme bekleniyor',sim:true}};
payModal('Sipariş: '+items.length+' kalem',total)}
function donate(pid,t){const p=S.products.find(x=>x.id==pid),q=+$('#dq'+pid).value;if(!(q>0))return toast('Geçersiz adet.');pend={k:'don',d:{id:uid('d'),pid,type:t,name:p.name,q,total:p.price*q,sim:true}};payModal((t=='food'?'Dayanışma Havuzu: ':'Eğitim Desteği: ')+q+'× '+p.name,p.price*q)}
function payRes(r){if(busy||!pend)return;busy=true;const p=pend;pend=null;modal('');
if(p.k=='order'){const o=p.o;if(r=='ok'){for(const i of o.items){const pr=S.products.find(x=>x.id==i.pid);if(pr.stock<i.q){o.status='Ödeme başarısız';toast('Stok yetersiz, sipariş oluşturulamadı.');S.orders.unshift(o);busy=false;save();return render()}}
o.items.forEach(i=>S.products.find(x=>x.id==i.pid).stock-=i.q);o.status='Ödendi / Beklemede';cart=[];notify('Veli','Ödeme tamamlandı (TEST). Sipariş '+o.no+' oluşturuldu.');notify('Kantinci','Yeni sipariş: '+o.no);toast('Test ödemesi başarılı.');log('Sipariş oluşturuldu '+o.no,'order');S.orders.unshift(o);tab='Siparişlerim'}
else if(r=='fail'){o.status='Ödeme başarısız';S.orders.unshift(o);notify('Veli','Ödeme başarısız oldu.');toast('Ödeme başarısız. Sipariş kesinleşmedi.');tab='Siparişlerim'}else toast('Ödeme iptal edildi.')}
else{const d=p.d;if(r=='ok'){d.status='Ödendi';const x=S.pool[d.pid]||(S.pool[d.pid]={qty:0,alloc:0,deliv:0});x.qty+=d.q;S.dons.unshift(d);notify('Veli','Bağış tamamlandı (TEST). Teşekkürler!');log('Bağış alındı','donation');toast('Test bağışı alındı, kaynak havuza eklendi.');tab='Bağış Geçmişim'}
else if(r=='fail'){d.status='Başarısız';S.dons.unshift(d);toast('Ödeme başarısız. Bağış havuza eklenmedi.')}else toast('Ödeme iptal edildi.')}
busy=false;save();render()}
function cancelOrder(id){const o=S.orders.find(x=>x.id==id);if(o.status=='Ödendi / Beklemede')o.items.forEach(i=>S.products.find(p=>p.id==i.pid).stock+=i.q);o.status='İptal edildi';log('Sipariş iptal '+o.no,'order');save();render()}
function advance(id){const o=S.orders.find(x=>x.id==id),n=NEXT[o.status];if(!n)return;o.status=n;notify('Veli','Siparişiniz: '+n+' ('+o.no+')');log(o.no+' → '+n,'order');save();render()}
function saveProd(id){const p=S.products.find(x=>x.id==id),pr=Math.round(+$('#pp'+id).value*100),st=+$('#ps'+id).value;if(!(pr>=0)||!(st>=0))return toast('Geçersiz değer.');p.price=pr;p.stock=Math.floor(st);log('Ürün güncellendi '+p.name,'product');save();toast('Kaydedildi.');render()}
function togProd(id){const p=S.products.find(x=>x.id==id);p.active=!p.active;save();render()}
function newProd(){const n=$('#np').value.trim(),pr=Math.round(+$('#npp').value*100),st=+$('#nps').value||0;if(!n||!(pr>0))return toast('Ad ve fiyat gerekli.');S.products.push({id:uid('p'),name:n,desc:'',price:pr,stock:st,type:'food',al:'',active:true});save();render()}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function addNeed(){const n=$('#nn').value.trim(),g=$('#ng').value.trim(),t=$('#nt').value;if(n.length<3||!g)return toast('Ad ve sınıf gerekli.');if(S.needs.some(x=>x.name.toLowerCase()==n.toLowerCase()&&x.grade==g&&x.type==t))return toast('Uyarı: Bu öğrenci için aynı türde kayıt zaten var.');S.needs.push({id:uid('n'),name:n,grade:g,type:t,desc:$('#nd').value.trim()});log('İhtiyaç kaydı oluşturuldu','need');save();render()}
async function genCode(nid){const a=new Uint8Array(8);crypto.getRandomValues(a);const code=[...a].map(x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');S.codes.filter(c=>c.nid==nid&&c.st=='Aktif').forEach(c=>c.st='Yenilendi');S.codes.push({nid,h:await sha(code),st:'Aktif',exp:Date.now()+30*864e5});log('İhtiyaç kodu üretildi','code');save();render();modal(`<h3>İhtiyaç kodu</h3><p style="font-size:1.8rem;letter-spacing:.15em;font-weight:700">${code}</p><p class="mu">Kod yalnızca şimdi gösterilir; sistemde yalnızca özeti saklanır. 30 gün geçerlidir.</p><button onclick="modal('')">Tamam</button>`)}
function revoke(nid){S.codes.filter(c=>c.nid==nid&&c.st=='Aktif').forEach(c=>c.st='İptal');save();render()}
function allocate(){const nid=$('#an').value,pid=$('#ap').value,q=Math.floor(+$('#aq').value),nd=S.needs.find(n=>n.id==nid);if(!(q>0))return toast('Geçersiz miktar.');if(q>avail(0,pid))return toast('Yetersiz kaynak. Kalan: '+avail(0,pid));
const c=S.codes.find(c=>c.nid==nid&&c.st=='Aktif');if(!c)return toast('Önce bu öğrenci için ihtiyaç kodu üretin.');
const t=S.products.find(p=>p.id==pid).type;if(nd.type!=t&&!confirm('İhtiyaç türü ile kaynak türü farklı. Devam edilsin mi?'))return;
S.pool[pid].alloc+=q;S.allocs.unshift({id:uid('a'),no:'TH-'+Date.now().toString(36).toUpperCase(),needId:nid,type:t,items:[{pid,q,d:0}],status:'Tahsis edildi'});notify('Kantinci','Yeni destek tahsisi.');log('Tahsis oluşturuldu','allocation');save();toast('Tahsis oluşturuldu.');render()}
function cancelAlloc(id){const a=S.allocs.find(x=>x.id==id);if(a.status!='Tahsis edildi')return;const r=prompt('İptal gerekçesi:');if(!r)return;a.items.forEach(i=>S.pool[i.pid].alloc-=i.q-i.d);a.status='İptal edildi';log('Tahsis iptal: '+r,'allocation');save();render()}
async function verify(){if(Date.now()<lockUntil)return toast('Çok fazla deneme. Biraz bekleyin.');const code=$('#dc').value.trim().toUpperCase(),h=await sha(code),c=S.codes.find(c=>c.h==h&&c.st=='Aktif'&&c.exp>Date.now());
const als=c?S.allocs.filter(a=>a.needId==c.nid&&a.status=='Tahsis edildi'):[];
if(!als.length){if(++fails>=5){lockUntil=Date.now()+30000;fails=0}log('Başarısız kod denemesi','code');save();return $('#dres').innerHTML='<p style="color:var(--r)">Kod geçersiz veya teslim edilecek tahsis yok.</p>'}
fails=0;const nd=S.needs.find(n=>n.id==c.nid);$('#dres').innerHTML=`<p><b>${esc(nd.name)} (${esc(nd.grade)})</b></p>${als.map(al=>`<p><b>${al.no}</b>: ${al.items.map(i=>`${i.q-i.d}× ${esc(pname(i.pid))}`).join(', ')}</p>`).join('')}<button onclick="deliver('${c.nid}')">Teslim edildi olarak kaydet</button>`}
function deliver(nid){const als=S.allocs.filter(a=>a.needId==nid&&a.status=='Tahsis edildi');if(!als.length)return toast('Bu tahsis zaten teslim edilmiş.');als.forEach(a=>{a.items.forEach(i=>{const r=i.q-i.d;S.pool[i.pid].alloc-=r;S.pool[i.pid].deliv+=r;i.d=i.q});a.status='Teslim edildi';log('Destek teslim edildi '+a.no,'delivery')});S.codes.filter(c=>c.nid==nid&&c.st=='Aktif').forEach(c=>c.st='Kullanıldı');save();toast('Teslimat kaydedildi.');$('#dres').innerHTML='';render()}
function addAcct(){const n=$('#an1').value.trim(),e=$('#ae').value.trim();if(n.length<3||!/^\S+@\S+\.\S+$/.test(e))return toast('Geçerli ad ve e-posta girin.');if(S.accts.some(a=>a.email.toLowerCase()==e.toLowerCase()))return toast('Bu e-posta ile zaten bir hesap var.');S.accts.push({id:uid('u'),name:n,email:e,role:$('#ar').value,active:true});log('Hesap daveti: '+e,'account');save();toast('Davet oluşturuldu (demo — e-posta gönderilmedi).');render()}
function togAcct(id){const a=S.accts.find(x=>x.id==id);a.active=!a.active;log('Hesap durumu: '+a.email,'account');save();render()}
function saveBreak(id){const b=S.breaks.find(x=>x.id==id),s=$('#bs'+id).value,e=$('#be'+id).value;if(!s||!e||s>=e)return toast('Geçerli saat aralığı girin.');if(S.breaks.some(x=>x.id!=id&&s<x.end&&e>x.start))return toast('Bu aralık başka bir teneffüsle çakışıyor.');b.start=s;b.end=e;save();toast('Kaydedildi.')}
function addBreak(){const n=$('#nbn').value.trim();if(!n)return;S.breaks.push({id:uid('b'),name:n,start:'13:00',end:'13:10'});save();render()}
function csv(){const r=[['sipariş_no','tarih','teneffüs','durum','tutar_TL']].concat(S.orders.map(o=>[o.no,o.date,o.brk,o.status,(o.total/100).toFixed(2)]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.join(';')).join('\n')],{type:'text/csv'}));a.download='rapor.csv';a.click()}
render();
</script></body></html>
